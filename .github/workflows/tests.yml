name: tests

on:
  pull_request:
  push:
    branches: [develop, qa, staging, release, master]

permissions:
  contents: read

jobs:
  headless:
    name: headless (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      GODOT_VERSION: "4.7.2"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Godot (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          echo "GODOT=/usr/local/bin/godot" >> "$GITHUB_ENV"

      - name: Install Godot (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/godotengine/godot/releases/download/$env:GODOT_VERSION-stable/Godot_v$env:GODOT_VERSION-stable_win64.exe.zip" -OutFile godot.zip
          Expand-Archive godot.zip -DestinationPath godot_bin
          $exe = (Get-ChildItem godot_bin -Filter "*console.exe" | Select-Object -First 1).FullName
          "GODOT=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install Godot (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
          unzip -q godot.zip
          echo "GODOT=$PWD/Godot.app/Contents/MacOS/Godot" >> "$GITHUB_ENV"

      - name: Changelog gate
        if: github.event_name == 'pull_request'
        shell: bash
        run: bash tools/check_changelog.sh "origin/${{ github.base_ref }}"

      - name: Run headless test suites
        shell: bash
        run: bash tools/run_tests.sh
